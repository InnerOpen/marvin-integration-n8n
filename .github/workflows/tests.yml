name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: MarvinIntegrationN8n
      - name: Check out the SDK next to this repo (resolved via [tool.uv.sources]; the release this plugin requires)
        uses: actions/checkout@v4
        with:
          repository: InnerOpen/marvin-integration-sdk
          ref: v0.13.0
          path: MarvinIntegrationSDK
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Test
        working-directory: MarvinIntegrationN8n
        run: uv run --extra dev pytest -q
      - name: Lint
        working-directory: MarvinIntegrationN8n
        run: uv run --extra dev ruff check .
